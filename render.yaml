services:
  - type: web
    name: skillscout-ml
    runtime: docker
    rootDir: ml-service
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: best_model.keras
      - key: TOKENIZER_PATH
        value: tokenizer.joblib
      - key: MAX_LENGTH
        value: "256"
      - key: BATCH_SIZE
        value: "32"
      - key: ALLOWED_ORIGINS
        value: "https://skillscout-nusantara-7kxc.vercel.app,https://skillscout-nusantara.vercel.app"
